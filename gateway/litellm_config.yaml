# gateway/litellm_config.yaml
# LiteLLM Proxy configuration — model routing, fallbacks, rate caps.
# This file is used when running `litellm --config gateway/litellm_config.yaml`
# See: https://docs.litellm.ai/docs/proxy/configs
#
# Authentication: Application Default Credentials (ADC) only.
# No API keys or service-account JSON files are used.
# Run `gcloud auth application-default login` locally, or rely on
# Workload Identity / Cloud Run service account in production.
#
# To list available Vertex AI regions for your project (Cloud Shell):
#   gcloud ai locations list --project=agentic-job-harvester
#
# All Gemini 2.5 models route through the Vertex AI "global" endpoint,
# which lets Google auto-route to the nearest available region.
# text-embedding-004 uses us-central1 (stable; "global" is not yet
# guaranteed for all embedding model versions).

general_settings:
  master_key: "os.environ/LITELLM_PROXY_API_KEY"
  # database_url intentionally omitted — no Postgres instance is provisioned.
  # Add back as "os.environ/LITELLM_DB_URL" when standing up LiteLLM's own
  # request-logging database; leaving it set to an unresolved env var causes
  # the proxy to fail at startup.
  store_model_in_db: false

model_list:
  # ── Fast Flash — used by all Tier 1 + Tier 2 agents ─────────────────────────
  - model_name: fast-flash
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_project: agentic-job-harvester
      vertex_location: global
      temperature: 0.1
      max_tokens: 4096
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 4096
      cost_per_input_token: 0.000000075
      cost_per_output_token: 0.000000300

  # ── Deep Pro — ReflectionAgent only (weekly, cost-tolerant) ─────────────────
  - model_name: deep-pro
    litellm_params:
      model: vertex_ai/gemini-2.5-pro
      vertex_project: agentic-job-harvester
      vertex_location: global
      temperature: 0.2
      max_tokens: 8192
      rpm: 10    # hard cap per AGENTS.md: "gemini-pro → rate-limited to 10 RPM"
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 8192
      cost_per_input_token: 0.00000125
      cost_per_output_token: 0.00001000

  # ── Router Flash — cheapest viable model for JobIntakeRouter ─────────────────
  - model_name: router-flash
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_project: agentic-job-harvester
      vertex_location: global
      temperature: 0.0
      max_tokens: 512
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 512

  # ── Embeddings — text-embedding-004 via Vertex AI ────────────────────────────
  # Called by client.py:generate_embedding() → litellm.aembedding("text-embedding-004")
  # Uses us-central1 (stable; "global" not yet guaranteed for embedding models).
  - model_name: text-embedding-004
    litellm_params:
      model: vertex_ai/text-embedding-004
      vertex_project: agentic-job-harvester
      vertex_location: us-central1
    model_info:
      max_input_tokens: 2048
      output_vector_size: 768

router_settings:
  # Fallback chain: if fast-flash fails, fall back to router-flash.
  # deep-pro falls back to fast-flash (graceful degradation if Pro unavailable).
  # NOTE: a model must NOT list itself as its own fallback — that causes an infinite loop.
  fallbacks:
    - fast-flash:
        - router-flash
    - deep-pro:
        - fast-flash

  # Retry configuration
  num_retries: 2
  retry_after: 5      # seconds between retries
  allowed_fails: 1
  cooldown_time: 30   # seconds to wait before re-routing to a failed model

litellm_settings:
  # LangFuse callback — auto-logs all prompts/tokens/latency
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  langfuse_public_key: "os.environ/LANGFUSE_PUBLIC_KEY"
  langfuse_secret_key: "os.environ/LANGFUSE_SECRET_KEY"
  langfuse_host: "os.environ/LANGFUSE_HOST"

  # Rate limits (per model per minute)
  rpm_limit: 60
  tpm_limit: 4000000

  # Cost tracking
  track_cost_callback: true
  max_budget: 50.0    # USD monthly guard rail
  budget_duration: "1mo"

  # Request/response timeouts
  request_timeout: 60    # seconds
  stream_timeout: 120
