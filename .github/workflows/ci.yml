name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  offline:
    name: Offline tests and quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      LANGFUSE_TRACING_ENABLED: "false"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check serious Python errors
        run: python -m ruff check . --no-cache --select E9,F63,F7,F82

      - name: Report existing Ruff findings
        run: python -m ruff check . --no-cache --exit-zero

      - name: Run guarded offline tests
        run: python -B scripts/run_offline_tests.py -p pytest_asyncio.plugin
